name: Build Logic 2

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      logic2: true

  hla:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/upload-artifact@v7
      with:
        name: logic2_hla
        path: |
          extension.json
          HighLevelAnalyzer.py
