name: Build and Release

on:
  push:
    branches: [ master ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: ISO7816Analyzer-linux-x86_64.so
            lib: install/Analyzers/libISO7816Analyzer.so

          - os: macos-13
            artifact: ISO7816Analyzer-macos-x86_64.dylib
            lib: install/Analyzers/libISO7816Analyzer.dylib

          - os: macos-latest
            artifact: ISO7816Analyzer-macos-arm64.dylib
            lib: install/Analyzers/libISO7816Analyzer.dylib

          - os: windows-latest
            artifact: ISO7816Analyzer-windows-x86_64.dll
            lib: install/Analyzers/ISO7816Analyzer.dll

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.artifact }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Install
        run: cmake --install build --config Release --prefix install

      - name: Rename artifact
        shell: bash
        run: cp "${{ matrix.lib }}" "${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
