name: Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.2.0)'
        required: true
        type: string
  push:
    tags:
      - '*'

jobs:

  # ── Logic 2 ──────────────────────────────────────────────────────────────────

  logic2-windows-x86_64:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v6
    - name: Build
      run: |
        cmake -B ${{github.workspace}}/build -A x64 -DLOGIC2=ON
        cmake --build ${{github.workspace}}/build --config Release
    - uses: actions/upload-artifact@v7
      with:
        name: logic2_windows_x86_64
        path: ${{github.workspace}}/build/Analyzers/Release/*.dll

  logic2-windows-arm64:
    runs-on: windows-11-arm
    steps:
    - uses: actions/checkout@v6
    - name: Build
      run: |
        cmake -B ${{github.workspace}}/build -A ARM64 -DLOGIC2=ON
        cmake --build ${{github.workspace}}/build --config Release
    - uses: actions/upload-artifact@v7
      with:
        name: logic2_windows_arm64
        path: ${{github.workspace}}/build/Analyzers/Release/*.dll

  logic2-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v6
    - name: Build
      run: |
        cmake -B ${{github.workspace}}/build/x86_64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=x86_64 -DLOGIC2=ON
        cmake --build ${{github.workspace}}/build/x86_64
        cmake -B ${{github.workspace}}/build/arm64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 -DLOGIC2=ON
        cmake --build ${{github.workspace}}/build/arm64
    - uses: actions/upload-artifact@v7
      with:
        name: logic2_macos_x86_64
        path: ${{github.workspace}}/build/x86_64/Analyzers/*.so
    - uses: actions/upload-artifact@v7
      with:
        name: logic2_macos_arm64
        path: ${{github.workspace}}/build/arm64/Analyzers/*.so

  logic2-linux-x86_64:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Pull builder image
      run: docker pull ghcr.io/saleae/analyzer-build-image:linux-x86_64
    - name: Build
      run: |
        docker run --rm \
          -v ${{ github.workspace }}:/app \
          -w /app \
          ghcr.io/saleae/analyzer-build-image:linux-x86_64 \
          bash -c 'cmake -B build -DCMAKE_BUILD_TYPE=Release -DLOGIC2=ON && cmake --build build'
    - uses: actions/upload-artifact@v7
      with:
        name: logic2_linux_x86_64
        path: ${{github.workspace}}/build/Analyzers/*.so

  logic2-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
    - uses: actions/checkout@v6
    - name: Pull builder image
      run: docker pull ghcr.io/saleae/analyzer-build-image:linux-arm64
    - name: Build
      run: |
        docker run --rm \
          -v ${{ github.workspace }}:/app \
          -w /app \
          ghcr.io/saleae/analyzer-build-image:linux-arm64 \
          bash -c 'cmake -B build -DCMAKE_BUILD_TYPE=Release -DLOGIC2=ON && cmake --build build'
    - uses: actions/upload-artifact@v7
      with:
        name: logic2_linux_arm64
        path: ${{github.workspace}}/build/Analyzers/*.so

  # ── Legacy Logic 1.x ─────────────────────────────────────────────────────────

  legacy-windows-x86_64:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v6
    - name: Build
      run: |
        cmake -B ${{github.workspace}}/build -A x64 -DLOGIC2=OFF
        cmake --build ${{github.workspace}}/build --config Release
    - uses: actions/upload-artifact@v7
      with:
        name: legacy_windows_x86_64
        path: ${{github.workspace}}/build/Analyzers/Release/*.dll

  legacy-windows-arm64:
    runs-on: windows-11-arm
    steps:
    - uses: actions/checkout@v6
    - name: Build
      run: |
        cmake -B ${{github.workspace}}/build -A ARM64 -DLOGIC2=OFF
        cmake --build ${{github.workspace}}/build --config Release
    - uses: actions/upload-artifact@v7
      with:
        name: legacy_windows_arm64
        path: ${{github.workspace}}/build/Analyzers/Release/*.dll

  legacy-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v6
    - name: Build
      run: |
        cmake -B ${{github.workspace}}/build/x86_64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=x86_64 -DLOGIC2=OFF
        cmake --build ${{github.workspace}}/build/x86_64
        cmake -B ${{github.workspace}}/build/arm64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 -DLOGIC2=OFF
        cmake --build ${{github.workspace}}/build/arm64
    - uses: actions/upload-artifact@v7
      with:
        name: legacy_macos_x86_64
        path: ${{github.workspace}}/build/x86_64/Analyzers/*.so
    - uses: actions/upload-artifact@v7
      with:
        name: legacy_macos_arm64
        path: ${{github.workspace}}/build/arm64/Analyzers/*.so

  legacy-linux-x86_64:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Pull builder image
      run: docker pull ghcr.io/saleae/analyzer-build-image:linux-x86_64
    - name: Build
      run: |
        docker run --rm \
          -v ${{ github.workspace }}:/app \
          -w /app \
          ghcr.io/saleae/analyzer-build-image:linux-x86_64 \
          bash -c 'cmake -B build -DCMAKE_BUILD_TYPE=Release -DLOGIC2=OFF && cmake --build build'
    - uses: actions/upload-artifact@v7
      with:
        name: legacy_linux_x86_64
        path: ${{github.workspace}}/build/Analyzers/*.so

  legacy-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
    - uses: actions/checkout@v6
    - name: Pull builder image
      run: docker pull ghcr.io/saleae/analyzer-build-image:linux-arm64
    - name: Build
      run: |
        docker run --rm \
          -v ${{ github.workspace }}:/app \
          -w /app \
          ghcr.io/saleae/analyzer-build-image:linux-arm64 \
          bash -c 'cmake -B build -DCMAKE_BUILD_TYPE=Release -DLOGIC2=OFF && cmake --build build'
    - uses: actions/upload-artifact@v7
      with:
        name: legacy_linux_arm64
        path: ${{github.workspace}}/build/Analyzers/*.so

  # ── Publish ──────────────────────────────────────────────────────────────────

  publish:
    needs:
      - logic2-windows-x86_64
      - logic2-windows-arm64
      - logic2-macos
      - logic2-linux-x86_64
      - logic2-linux-arm64
      - legacy-windows-x86_64
      - legacy-windows-arm64
      - legacy-macos
      - legacy-linux-x86_64
      - legacy-linux-arm64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v8
      with:
        path: ${{github.workspace}}/artifacts
    - name: Zip Logic 2 builds
      run: |
        cd ${{github.workspace}}/artifacts
        zip -r ${{github.workspace}}/analyzer_logic2.zip logic2_*
    - name: Zip Legacy builds
      run: |
        cd ${{github.workspace}}/artifacts
        zip -r ${{github.workspace}}/analyzer_legacy.zip legacy_*
    - uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ inputs.tag_name || github.ref_name }}
        files: |
          ${{github.workspace}}/analyzer_logic2.zip
          ${{github.workspace}}/analyzer_legacy.zip
