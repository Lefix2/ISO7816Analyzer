name: Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.2.0)'
        required: true
        type: string
  push:
    tags:
      - '*'

jobs:

  build-logic2:
    uses: ./.github/workflows/_build_logic2.yml

  build-legacy:
    uses: ./.github/workflows/_build_legacy.yml

  publish:
    needs: [build-logic2, build-legacy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v8
      with:
        path: ${{github.workspace}}/artifacts
    - name: Zip Logic 2 builds
      run: |
        cd ${{github.workspace}}/artifacts
        zip -r ${{github.workspace}}/analyzer_logic2.zip logic2_*
    - name: Zip Legacy builds
      run: |
        cd ${{github.workspace}}/artifacts
        zip -r ${{github.workspace}}/analyzer_legacy.zip legacy_*
    - uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ inputs.tag_name || github.ref_name }}
        files: |
          ${{github.workspace}}/analyzer_logic2.zip
          ${{github.workspace}}/analyzer_legacy.zip
